<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Civil Career</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="logo">🏗️ CIVIL CAREER</div>
  <div class="nav-links">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('login') }}">Login</a>
  </div>
</nav>
<main class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h1>Forgot Password?</h1>
      <p>Enter your registered email to receive a reset code.</p>
    </div>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    {% if message %}<div class="login-message">{{ message }}</div>{% endif %}
    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="form-group">
        <label for="email">Registered Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
      </div>
      <button type="submit" class="login-button">Send Reset Code</button>
    </form>
    <div class="register-section">
      <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
  </div>
</main>
<footer class="footer"><p>© 2026 CIVIL CAREER | Civil Engineering Career Platform</p></footer>
</body>
</html>
