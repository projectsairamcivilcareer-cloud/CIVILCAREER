<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Civil Career</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}?v=login-civil-1003">
    <link rel="icon" type="image/svg+xml" href="/static/images/civil-career-icon.svg?v=20260924">
    <link rel="apple-touch-icon" href="/static/images/civil-career-icon.svg?v=20260924">
    <link rel="manifest" href="/static/site.webmanifest">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <a href="/" aria-label="Civil Career Home">
                <img src="/static/images/civil-career-brand.svg?v=20261002"
                     alt="CIVIL CAREER — Learn, Practice, Build Your Career"
                     style="display:block;width:340px;max-width:60vw;height:auto;">
            </a>
        </div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </nav>

    <main class="login-page">

        <div class="login-container">

            <div class="login-header">
                <div class="login-icon" aria-hidden="true">
                    <img src="/static/images/civil-career-icon.svg" alt="">
                </div>

                <h1>Welcome Back</h1>

                <p>Login to your CIVIL CAREER account</p>
            </div>

            {% if error %}
            <div class="login-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST"
                  action="{{ url_for('login') }}"
                  autocomplete="on">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrap">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>
                        <button type="button"
                                class="show-password"
                                onclick="togglePassword('password', this)">Show</button>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

                <div class="forgot-password-link">
                    <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
                </div>

            </form>

            <div class="register-section">
                <p>Don't have an account?</p>
                <a href="{{ url_for('register') }}">Create New Account</a>
            </div>

        </div>
    </main>

    <footer class="footer">
        <p>
            © 2026 CIVIL CAREER |
            Civil Engineering Career Platform
        </p>
    </footer>

<script>
function togglePassword(id, button) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
  button.textContent = input.type === "password" ? "Show" : "Hide";
}
</script>
</body>

</html>
