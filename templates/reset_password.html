<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Civil Career</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="logo">🏗️ CIVIL CAREER</div>
  <div class="nav-links">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('login') }}">Login</a>
  </div>
</nav>
<main class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="login-icon">🔑</div>
      <h1>Reset Password</h1>
      <p>Enter the code sent to your email and create a new password.</p>
    </div>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('reset_password') }}">
      <input type="hidden" name="email" value="{{ email }}">
      <div class="form-group">
        <label for="code">Reset Code</label>
        <input type="text" id="code" name="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
      </div>
      <div class="form-group">
        <label for="password">New Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Enter new password" autocomplete="new-password" required>
          <button type="button" class="show-password" onclick="togglePassword('password', this)">Show</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="password-wrap">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required>
          <button type="button" class="show-password" onclick="togglePassword('confirm_password', this)">Show</button>
        </div>
      </div>
      <button type="submit" class="login-button">Reset Password</button>
    </form>
    <div class="register-section">
      <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
  </div>
</main>
<footer class="footer"><p>© 2026 CIVIL CAREER | Civil Engineering Career Platform</p></footer>
<script>
function togglePassword(id, button) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
  button.textContent = input.type === "password" ? "Show" : "Hide";
}
</script>
</body>
</html>
