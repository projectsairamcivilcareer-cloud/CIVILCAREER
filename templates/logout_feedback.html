<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civil Career - Feedback Required</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(560px,92%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 15px 40px rgba(15,23,42,.10)}
h1{margin:0 0 8px;font-size:25px}p{color:#64748b;line-height:1.6}
label{display:block;font-weight:700;margin:18px 0 9px}
.rating{display:flex;gap:8px}.rating label{margin:0;flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:12px;text-align:center;cursor:pointer}
.rating input{margin-right:5px}
textarea{width:100%;box-sizing:border-box;min-height:130px;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;margin:15px 0}
</style>
</head>
<body>
<div class="card">
<h1>⭐ Before you leave Civil Career</h1>
<p>{{ student_name }}, please share your feedback. Feedback is required before logout.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
<label>Rate your Civil Career experience</label>
<div class="rating">
{% for rating in range(1,6) %}
<label><input type="radio" name="rating" value="{{ rating }}" required>{{ rating }} ⭐</label>
{% endfor %}
</div>
<label for="comments">Your feedback</label>
<textarea id="comments" name="comments" required placeholder="Tell us what you liked, what should be improved, or what you want next..."></textarea>
<button type="submit">Submit Feedback & Logout</button>
</form>
</div>
</body>
</html>
