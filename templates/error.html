<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} | Civil Career</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#12355B;min-height:100vh;display:grid;place-items:center;padding:24px}
        .card{max-width:620px;width:100%;background:#fff;border-radius:20px;padding:42px;text-align:center;box-shadow:0 16px 40px rgba(18,53,91,.12)}
        .code{font-size:64px;font-weight:800;margin-bottom:8px}
        h1{margin:0 0 12px;font-size:28px}
        p{color:#64748B;line-height:1.7;margin:0 0 24px}
        .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        a{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}
        .primary{background:#12355B;color:#fff}
        .secondary{background:#E8F1F5;color:#12355B}
    </style>
</head>
<body>
    <main class="card">
        <div class="code">{{ error_code }}</div>
        <h1>{{ error_title }}</h1>
        <p>{{ error_message }}</p>
        <div class="actions">
            <a class="primary" href="{{ url_for('home') }}">Home</a>
            {% if session.get('student_id') %}
            <a class="secondary" href="{{ url_for('dashboard') }}">Dashboard</a>
            {% else %}
            <a class="secondary" href="{{ url_for('login') }}">Login</a>
            {% endif %}
        </div>
    </main>
</body>
</html>
