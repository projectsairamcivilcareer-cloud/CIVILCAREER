<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Civil Career</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

    <!-- NAVIGATION -->

    <nav class="navbar">

        <div class="logo">
            🏗️ CIVIL CAREER
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/about">About</a>

            <a href="/login">Login</a>

        </div>

    </nav>


    <!-- REGISTER -->

    <main class="login-page">

        <div class="login-container">

            <div class="login-header">

                <div class="login-icon">
                    🎓
                </div>

                <h1>Create Account</h1>

                <p>
                    Join CIVIL CAREER and start your journey
                </p>

            </div>


            <form method="POST" action="/register">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                                <div class="form-group">
                    <label for="mobile_country_code">Mobile Country</label>
                    <select id="mobile_country_code" name="mobile_country_code" required>
                        <option value="">Select country code</option>
                        <option value="+91">🇮🇳 India (+91)</option>
                        <option value="+1">🇺🇸 USA (+1)</option>
                        <option value="+44">🇬🇧 UK (+44)</option>
                        <option value="+61">🇦🇺 Australia (+61)</option>
                        <option value="+971">🇦🇪 UAE (+971)</option>
                        <option value="+65">🇸🇬 Singapore (+65)</option>
                        <option value="+1">🇨🇦 Canada (+1)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mobile_number">Mobile Number <span class="required-star">*</span></label>
                    <input type="tel" id="mobile_number" name="mobile_number" inputmode="numeric" placeholder="Enter mobile number" required>
                </div>
<!-- EDUCATION -->

                <div class="form-group">

                    <label for="education">
                        Education
                    </label>

                    <select
                        id="education"
                        name="education"
                        required
                    >

                        <option value="">
                            Select your qualification
                        </option>

                        <option value="Diploma">
                            Diploma Civil Engineering
                        </option>

                        <option value="B.Tech">
                            B.Tech Civil Engineering
                        </option>

                        <option value="GATE">
                            GATE Aspirant
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrap">
<input type="password" id="password" name="password" placeholder="Create a password" required>
<button type="button" class="show-password" onclick="togglePassword('password', this)">Show</button>
</div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <div class="password-wrap">
<input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
<button type="button" class="show-password" onclick="togglePassword('confirm_password', this)">Show</button>
</div>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    CREATE ACCOUNT

                </button>

            </form>


            <div class="register-section">

                <p>
                    Already have an account?
                </p>

                <a href="/login">
                    Login
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 CIVIL CAREER | Civil Engineering Career Platform
        </p>

    </footer>

<script>
function togglePassword(id, button) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
  button.textContent = input.type === "password" ? "Show" : "Hide";
}
</script></body>

</html>
