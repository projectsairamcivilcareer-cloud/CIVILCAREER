name: Python Syntax and CSRF Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python source files
        run: python -m compileall -q .
      - name: Run CSRF middleware integration tests
        run: python -m unittest tests/test_csrf_middleware.py -v
